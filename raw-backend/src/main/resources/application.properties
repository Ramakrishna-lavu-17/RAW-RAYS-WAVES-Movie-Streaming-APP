spring.application.name=raw_backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/raw_backend
spring.datasource.username=postgres
spring.datasource.password=rama
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# TMDB (The Movie Database) API Configuration
tmdb.api.key=${TMDB_API_KEY:3bd1178d6511ec68671e3189871462ff}
tmdb.api.read-access-token=${TMDB_API_READ_ACCESS_TOKEN:eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIzYmQxMTc4ZDY1MTFlYzY4NjcxZTMxODk4NzE0NjJmZiIsIm5iZiI6MTc5MTcwOTc1Mi4zMiwic3ViIjoiNmFjYjUyMzg3ZGY0NjU3NDI2YmM4ZTM0Iiwic2NvcGVzIjpbImFwaV9yZWFkIl0sInZlcnNpb24iOjF9._0F5qABogJFFLw23WLMJhaIQUOvYxjWJLvyOqgZOgIg}
