# ===================================================================
# Local S3/R2-style Object Storage Configuration
# ===================================================================
# Primary provider: 'local' S3/R2-style object storage
raw.storage.provider=${RAW_STORAGE_PROVIDER:local}
raw.storage.bucket-name=${RAW_STORAGE_BUCKET:raw-movies}
raw.storage.local.root-path=${RAW_LOCAL_STORAGE_PATH:C:/raw-storage}
raw.storage.temp-path=${RAW_TEMP_STORAGE_PATH:C:/raw-storage/temp}

# Cloudflare R2 / S3 Configuration (optional cloud provider)
raw.storage.r2.account-id=${R2_ACCOUNT_ID:}
raw.storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
raw.storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
raw.storage.r2.bucket-name=${R2_BUCKET_NAME:raw-movies}
raw.storage.r2.public-url=${R2_PUBLIC_URL:}

# Video Transcoding & FFmpeg Configuration
raw.ffmpeg.path=${FFMPEG_PATH:C:/raw-storage/bin/ffmpeg.exe}
raw.ffprobe.path=${FFPROBE_PATH:C:/raw-storage/bin/ffprobe.exe}
raw.movie.max-duration-seconds=14400

# Multipart File Upload for Movies (up to 20GB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20GB
spring.servlet.multipart.max-request-size=20GB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=20GB



