services:
  backend:
    build:
      context: ./raw-backend
      dockerfile: Dockerfile
    container_name: raw-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/raw_backend
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: rama
      RAW_LOCAL_STORAGE_PATH: /raw-storage
      RAW_TEMP_STORAGE_PATH: /raw-storage/temp
    volumes:
      - C:/raw-storage:/raw-storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./raw-frontend
      dockerfile: Dockerfile
    container_name: raw-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
